<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' data: blob:; style-src 'self'; script-src 'self'" />
    <title>Zenopod</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div id="shell" class="shell">
      <!-- Tampilan kecil (kapsul) -->
      <div class="pill" id="pill">
        <span class="buddy-slot" id="buddy-slot"></span>
        <span class="pill-text" id="pill-text"></span>
        <span class="typing" id="typing" hidden><i></i><i></i><i></i></span>
        <span class="eq" id="eq" hidden><i></i><i></i><i></i></span>
        <span class="dev-alert" id="pill-dev-alert" title="Ada server lokal yang mati" hidden></span>
        <span class="pill-battery" id="pill-battery" hidden></span>
        <span class="mic-level" id="mic-level" hidden><i></i><i></i><i></i><i></i></span>
        <span class="badge" id="badge" hidden></span>
      </div>

      <!-- Kartu sementara: notifikasi, Claude, sapaan, pengingat -->
      <div class="peek" id="peek">
        <span class="peek-slot" id="peek-slot"></span>
        <div class="peek-main">
          <button type="button" class="peek-content" id="peek-content" tabindex="-1">
            <span class="peek-text">
              <span class="peek-app" id="peek-app"></span>
              <span class="peek-title" id="peek-title"></span>
              <span class="peek-body" id="peek-body"></span>
            </span>
            <img class="peek-icon" id="peek-icon" alt="" hidden />
          </button>
          <div class="peek-actions" id="peek-actions" hidden></div>
        </div>
      </div>

      <!-- Panel terbuka -->
      <div class="panel" id="panel">
        <button type="button" class="grip" id="grip" title="Geser Zenopod" aria-label="Geser Zenopod"><i></i><i></i><i></i><i></i><i></i><i></i></button>
        <!-- Kartu atas: swipe antar halaman (musik, sapaan, jam, hari ini) -->
        <section class="media hero" id="media">
          <!-- Maskot besar tetap di kiri, berganti wujud sesuai halaman -->
          <button type="button" class="buddy-big" id="buddy-big" title="Klik, tahan, atau elus aku!" aria-label="Maskot"></button>
          <span class="buddy-say" id="buddy-say" role="status" hidden></span>
          <div class="hero-view" id="hero-view" aria-roledescription="carousel">
            <div class="hero-track" id="hero-track">
              <div class="page claude-page" data-page="claude" aria-label="Claude Code">
                <div class="claude-head">
                  <span class="live" id="claude-live"></span>
                  <span class="claude-project" id="claude-project"></span>
                </div>
                <div class="claude-meta" id="claude-meta"></div>
                <ul class="claude-activity" id="claude-activity"></ul>
              </div>
              <div class="page media-main" data-page="music" aria-label="Musik">
                <div class="track">
                  <img class="art" id="art-img" alt="" hidden />
                  <div class="meta">
                    <div class="title" id="title">Tidak ada yang diputar</div>
                    <div class="artist" id="artist">Putar lagu di Spotify atau Chrome</div>
                  </div>
                </div>
                <div class="controls">
                  <button type="button" class="ctl" data-cmd="prev" title="Sebelumnya" aria-label="Sebelumnya">
                    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" /></svg>
                  </button>
                  <button type="button" class="ctl ctl-main" data-cmd="toggle" title="Putar / jeda" aria-label="Putar / jeda">
                    <svg viewBox="0 0 24 24" id="icon-play"><path d="M7 4.5v15L19.5 12z" /></svg>
                    <svg viewBox="0 0 24 24" id="icon-pause" hidden><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" /></svg>
                  </button>
                  <button type="button" class="ctl" data-cmd="next" title="Berikutnya" aria-label="Berikutnya">
                    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z" /></svg>
                  </button>
                </div>
              </div>
              <div class="page" data-page="greeting" aria-label="Sapaan">
                <div class="page-kicker" id="greet-kicker"></div>
                <div class="page-title" id="greet-title"></div>
                <div class="page-sub" id="greet-sub"></div>
              </div>
              <div class="page" data-page="clock" aria-label="Tanggal dan jam">
                <div class="clock-time" id="clock-time"></div>
                <div class="page-sub" id="clock-date"></div>
                <div class="page-sub dim" id="clock-hijri"></div>
              </div>
              <div class="page agenda-page" data-page="agenda" aria-label="Agenda">
                <div class="agenda-head">
                  <span class="page-kicker" id="agenda-kicker">Agenda</span>
                  <button type="button" class="agenda-join" id="agenda-join" hidden>Gabung</button>
                </div>
                <ul class="agenda-list" id="agenda-list"></ul>
              </div>
              <div class="page" data-page="weather" aria-label="Cuaca">
                <div class="page-kicker" id="weather-city"></div>
                <div class="weather-main">
                  <span class="weather-temp" id="weather-temp"></span>
                  <span class="weather-text">
                    <span class="weather-cond" id="weather-cond"></span>
                    <span class="page-sub dim" id="weather-feels"></span>
                  </span>
                </div>
                <div class="weather-next" id="weather-next"></div>
              </div>
              <div class="page" data-page="today" aria-label="Hari ini">
                <div class="page-kicker">Hari ini</div>
                <ul class="today-list" id="today-list"></ul>
              </div>
              <div class="page habits-page" data-page="habits" aria-label="Kebiasaan">
                <div class="page-kicker" id="habits-kicker">Kebiasaan hari ini</div>
                <div class="habit-chips" id="habit-chips"></div>
              </div>
              <div class="page pet-page" data-page="pet" aria-label="Zeno">
                <div class="pet-head">
                  <span class="pet-level" id="pet-level"></span>
                  <span class="pet-xp" id="pet-xp"></span>
                </div>
                <div class="pet-bar"><span>Kenyang</span><i><b id="pet-hunger"></b></i></div>
                <div class="pet-bar xp"><span>XP</span><i><b id="pet-xpbar"></b></i></div>
                <div class="pet-actions">
                  <button type="button" data-food="cookie" title="Kue (+20)">🍪</button>
                  <button type="button" data-food="apple" title="Apel (+25)">🍎</button>
                  <button type="button" data-food="rice" title="Nasi (+40)">🍙</button>
                  <button type="button" class="pet-play" id="pet-play">Main</button>
                </div>
              </div>
              <div class="page system-page" data-page="system" aria-label="Sistem">
                <div class="system-net" id="system-net"></div>
                <div class="pet-bar"><span>CPU</span><i><b id="system-cpu"></b></i><em id="system-cpu-text"></em></div>
                <div class="pet-bar"><span>RAM</span><i><b id="system-ram"></b></i><em id="system-ram-text"></em></div>
                <div class="pet-bar"><span id="system-disk-label">Disk</span><i><b id="system-disk"></b></i><em id="system-disk-text"></em></div>
              </div>
            </div>
          </div>
          <div class="hero-dots" id="hero-dots" role="tablist" aria-label="Halaman kartu"></div>
        </section>

        <div class="tabs">
          <div class="tab-list" role="tablist">
            <button type="button" role="tab" data-tab="apps" aria-selected="true">Aplikasi</button>
            <button type="button" role="tab" data-tab="notifs" id="tab-notifs" aria-selected="false">
              Notif <span class="count" id="notif-count" hidden></span>
            </button>
            <button type="button" role="tab" data-tab="focus" aria-selected="false">
              Fokus <span class="count live-count" id="focus-count" hidden></span>
            </button>
            <button type="button" role="tab" data-tab="clips" aria-selected="false">Klip</button>
            <button type="button" role="tab" data-tab="todos" aria-selected="false">
              Catatan <span class="count" id="todo-count" hidden></span>
            </button>
            <button type="button" role="tab" data-tab="dev" id="tab-dev" aria-selected="false" hidden>
              Dev <span class="dev-alert" id="dev-alert" hidden></span>
            </button>
          </div>
          <button type="button" class="link" id="tab-action" hidden></button>
        </div>

        <section class="apps-tab" id="apps-tab" role="tabpanel">
          <div class="search-box">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
            <input id="app-search" placeholder="Cari aplikasi…" autocomplete="off" spellcheck="false" aria-label="Cari aplikasi" />
          </div>
          <div class="apps" id="apps"></div>
          <div class="search-results" id="search-results" role="listbox" hidden></div>
        </section>
        <section class="notifs" id="notifs" role="tabpanel" hidden></section>
        <section class="list-tab" id="clips" role="tabpanel" hidden></section>
        <section class="list-tab dev-tab" id="dev" role="tabpanel" hidden>
          <div class="dev-group" id="dev-services"></div>
          <div class="dev-group" id="dev-projects"></div>
        </section>
        <section class="list-tab todos" id="todos" role="tabpanel" hidden>
          <form class="todo-form" id="todo-form">
            <input id="todo-input" maxlength="200" placeholder="Tulis catatan atau tugas, lalu Enter…" autocomplete="off" />
          </form>
          <div class="todo-list" id="todo-list"></div>
        </section>
        <section class="focus-tab" id="focus-tab" role="tabpanel" hidden>
          <div class="ring">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="ring-track" cx="50" cy="50" r="44" />
              <circle class="ring-bar" id="ring-bar" cx="50" cy="50" r="44" />
            </svg>
            <span class="ring-time" id="focus-time">25:00</span>
          </div>
          <div class="focus-info">
            <div class="focus-phase" id="focus-phase">Siap fokus?</div>
            <div class="focus-sub" id="focus-sub"></div>
            <div class="focus-dots" id="focus-dots"></div>
            <div class="focus-actions" id="focus-actions"></div>
            <div class="timer-list" id="timer-list"></div>
          </div>
        </section>

        <!-- Kontrol cepat Windows -->
        <div class="power-sheet quick-sheet" id="quick-sheet" hidden>
          <div class="quick-row">
            <button type="button" class="quick-icon" id="quick-mute" title="Bisukan" aria-label="Bisukan">
              <svg viewBox="0 0 16 16"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z" /><path class="waves" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" /><path class="slash" d="M10.5 6l4 4M14.5 6l-4 4" /></svg>
            </button>
            <input type="range" min="0" max="100" step="1" id="quick-volume" aria-label="Volume" />
            <span class="quick-value" id="quick-volume-value"></span>
          </div>
          <div class="quick-row" id="quick-brightness-row">
            <span class="quick-icon static">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8" /><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1" /></svg>
            </span>
            <input type="range" min="0" max="100" step="5" id="quick-brightness" aria-label="Kecerahan" />
            <span class="quick-value" id="quick-brightness-value"></span>
          </div>
          <div class="quick-toggles">
            <button type="button" class="quick-toggle" id="quick-wifi" aria-pressed="false">
              <svg viewBox="0 0 16 16"><path d="M1.8 6a9 9 0 0 1 12.4 0M4 8.4a6 6 0 0 1 8 0M6.2 10.8a3 3 0 0 1 3.6 0" /><circle cx="8" cy="13" r="0.8" /></svg>Wi-Fi
            </button>
            <button type="button" class="quick-toggle" id="quick-bluetooth" aria-pressed="false">
              <svg viewBox="0 0 16 16"><path d="M4.5 5l7 6-3.5 3V2l3.5 3-7 6" /></svg>Bluetooth
            </button>
          </div>
        </div>

        <!-- Menu daya -->
        <div class="power-sheet" id="power-sheet" hidden>
          <div class="power-menu" id="power-menu">
            <button type="button" data-power="lock"><svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" /><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" /></svg>Kunci</button>
            <button type="button" data-power="sleep"><svg viewBox="0 0 16 16"><path d="M12.5 9.5A5 5 0 1 1 6.5 3.5a4 4 0 0 0 6 6z" /></svg>Tidur</button>
            <button type="button" data-power="restart"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3" /></svg>Mulai ulang</button>
            <button type="button" data-power="shutdown"><svg viewBox="0 0 16 16"><path d="M8 2v5.5M4.6 4.2a5 5 0 1 0 6.8 0" /></svg>Matikan</button>
            <button type="button" data-power="signout"><svg viewBox="0 0 16 16"><path d="M6.5 13.5h-3v-11h3M10 5l3 3-3 3M13 8H6.5" /></svg>Keluar akun</button>
          </div>
          <div class="power-confirm" id="power-confirm" hidden>
            <div class="power-title" id="power-title"></div>
            <div class="power-sub">Simpan pekerjaanmu dulu ya.</div>
            <div class="power-actions">
              <button type="button" class="peek-btn" id="power-cancel">Batal</button>
              <button type="button" class="peek-btn primary" id="power-now">Sekarang</button>
            </div>
          </div>
        </div>

        <footer class="foot">
          <span class="hint" id="shortcut"></span>
          <button type="button" class="next-reminder" id="next-reminder" title="Buka pengingat" hidden>
            <svg viewBox="0 0 16 16"><circle cx="8" cy="9" r="5.2" /><path d="M8 6.4V9l1.8 1.2M3 3.2 4.6 2M13 3.2 11.4 2" /></svg>
            <span id="next-reminder-text"></span>
          </button>
          <div class="foot-actions">
            <button type="button" class="icon-link" id="snip-btn" title="Ambil teks dari layar" aria-label="Ambil teks dari layar">
              <svg viewBox="0 0 16 16"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3M5.5 6.5h5M5.5 9.5h3.5" /></svg>
            </button>
            <button type="button" class="icon-link" id="quick-btn" title="Kontrol cepat" aria-label="Kontrol cepat">
              <svg viewBox="0 0 16 16"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7" /><circle cx="11" cy="4.5" r="1.6" /><circle cx="5" cy="11.5" r="1.6" /></svg>
            </button>
            <button type="button" class="icon-link" id="power-btn" title="Daya" aria-label="Daya">
              <svg viewBox="0 0 16 16"><path d="M8 2v5.5M4.6 4.2a5 5 0 1 0 6.8 0" /></svg>
            </button>
            <button type="button" class="icon-link" id="edit" title="Pengaturan" aria-label="Pengaturan">
              <svg viewBox="0 0 16 16"><path d="M6.9 1.5h2.2l.4 1.7 1.3.6 1.5-.9 1.6 1.6-.9 1.5.6 1.3 1.7.4v2.2l-1.7.4-.6 1.3.9 1.5-1.6 1.6-1.5-.9-1.3.6-.4 1.7H6.9l-.4-1.7-1.3-.6-1.5.9-1.6-1.6.9-1.5-.6-1.3-1.7-.4V6.9l1.7-.4.6-1.3-.9-1.5 1.6-1.6 1.5.9 1.3-.6z" /><circle cx="8" cy="8" r="2" /></svg>
            </button>
          </div>
        </footer>
      </div>
    </div>
    <script src="buddy.js"></script>
    <script src="sounds.js"></script>
    <script src="app.js"></script>
  </body>
</html>
