# Installer macOS (.dmg) untuk Apple Silicon & Intel, dibangun di server Mac milik GitHub.
# - Setiap push ke main: hasilnya bisa diunduh di tab Actions › run terakhir › Artifacts.
# - Tag v* (atau jalankan manual dengan "release" dicentang): .dmg juga ditempel ke GitHub Release versinya.
name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['video/**', 'README.md']
  workflow_dispatch:
    inputs:
      release:
        description: 'Tempel .dmg ke GitHub Release versi package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Helper OCR (Vision) universal: Apple Silicon + Intel.
      - name: Build helper
        run: |
          mkdir -p build/mac
          swiftc -O -target arm64-apple-macos11 -o build/mac/helper-arm64 native/mac/zenopod-helper.swift
          swiftc -O -target x86_64-apple-macos11 -o build/mac/helper-x64 native/mac/zenopod-helper.swift
          lipo -create build/mac/helper-arm64 build/mac/helper-x64 -output build/mac/zenopod-helper
          rm build/mac/helper-arm64 build/mac/helper-x64
          codesign --force --sign - build/mac/zenopod-helper

      - name: Build dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Zenopod-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" dist/*.dmg --clobber
